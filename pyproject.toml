[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "columnforge"
version = "0.5.0"
description = "Deterministic, reversible transform pipelines between tabular schema versions."
requires-python = ">=3.9"

[project.scripts]
columnforge = "columnforge.cli:main"

[tool.setuptools]
packages = ["columnforge"]
